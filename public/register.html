<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PA Housing Fund — Create Account</title>
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/apple-touch-icon.png" />
<link rel="icon" href="/assets/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0a2540" />
<link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet" />
<link href="/assets/app.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-pahf navbar-fixed-top">
  <div class="container-fluid" style="padding-left:20px;padding-right:20px;">
    <div class="navbar-header">
      <a class="navbar-brand" href="/">
        <img src="/assets/apple-touch-icon.png" alt="PHFA" class="pahf-logo" />
        <span class="pahf-title">PA Housing Fund</span>
      </a>
    </div>
  </div>
</nav>

<div class="container" style="margin-top: 90px;">
  <div class="row">
    <div class="col-md-6 col-md-offset-3">
      <div class="card">
        <h2>Create Account</h2>
        <div id="errMsg" class="alert alert-danger hidden"></div>
        <div id="successBox" class="alert alert-success hidden"></div>

        <form id="regForm" autocomplete="off">
          <div class="form-group">
            <label>Full Name</label>
            <input name="fullName" class="form-control" required />
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input name="email" type="email" class="form-control" required />
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input name="phone" class="form-control" />
          </div>
          <div class="form-group">
            <label>Address</label>
            <input name="address" class="form-control" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input name="password" type="password" class="form-control" required minlength="6" />
          </div>
          <div class="form-group">
            <label>Security Question</label>
            <select name="securityQuestion" class="form-control" required>
              <option value="">— choose a question —</option>
              <option>What is your mother's maiden name?</option>
              <option>What city were you born in?</option>
              <option>What was your first pet's name?</option>
              <option>What is your favorite book?</option>
              <option>What was the make of your first car?</option>
            </select>
          </div>
          <div class="form-group">
            <label>Security Answer</label>
            <input name="securityAnswer" class="form-control" required />
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">CREATE ACCOUNT</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
const form = document.getElementById('regForm');
const errEl = document.getElementById('errMsg');
const okEl = document.getElementById('successBox');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.classList.add('hidden'); okEl.classList.add('hidden');
  const fd = new FormData(form);
  const body = Object.fromEntries(fd.entries());

  const r = await api('/api/auth/register', { method: 'POST', body: JSON.stringify(body) });
  if (!r.ok) {
    errEl.textContent = (r.data && r.data.error) || 'Registration failed.';
    errEl.classList.remove('hidden');
    return;
  }

  // Print the 6-digit code on-screen and send them to the verify page
  okEl.innerHTML = `
    <h4>Your Verification Code</h4>
    <p style="font-size:36px;font-weight:700;letter-spacing:6px;color:#054569;">${r.data.verificationCode}</p>
    <p>Write this code down. On the next page you will enter it to activate your account.</p>
    <a class="btn btn-primary" href="/verify.html?email=${encodeURIComponent(r.data.email)}">Continue to Verification →</a>
  `;
  okEl.classList.remove('hidden');
  form.classList.add('hidden');
});
</script>
</body>
</html>
