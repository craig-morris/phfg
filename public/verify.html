<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PA Housing Fund — Verify Account</title>
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/apple-touch-icon.png" />
<link rel="icon" href="/assets/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0a2540" />
<link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet" />
<link href="/assets/app.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-pahf navbar-fixed-top">
  <div class="container-fluid" style="padding-left:20px;padding-right:20px;">
    <div class="navbar-header">
      <a class="navbar-brand" href="/">
        <img src="/assets/apple-touch-icon.png" alt="PHFA" class="pahf-logo" />
        <span class="pahf-title">PA Housing Fund</span>
      </a>
    </div>
  </div>
</nav>

<div class="container" style="margin-top: 90px;">
  <div class="row">
    <div class="col-md-6 col-md-offset-3">
      <div class="card">
        <h2>Verify Your Account</h2>
        <p>Enter the 6-digit code you were shown on the previous page.</p>
        <div id="errMsg" class="alert alert-danger hidden"></div>
        <div id="okMsg" class="alert alert-success hidden"></div>

        <form id="vForm">
          <div class="form-group">
            <label>Email</label>
            <input id="email" type="email" class="form-control" required />
          </div>
          <div class="form-group">
            <label>6-Digit Code</label>
            <input id="code" class="form-control" inputmode="numeric" maxlength="6" required
                   style="font-size:24px;letter-spacing:8px;text-align:center;" />
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">VERIFY</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
if (params.get('email')) document.getElementById('email').value = params.get('email');

document.getElementById('vForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('errMsg');
  const okEl = document.getElementById('okMsg');
  errEl.classList.add('hidden'); okEl.classList.add('hidden');

  const email = document.getElementById('email').value.trim();
  const code = document.getElementById('code').value.trim();

  const r = await api('/api/auth/verify', { method: 'POST', body: JSON.stringify({ email, code }) });
  if (!r.ok) {
    errEl.textContent = (r.data && r.data.error) || 'Verification failed.';
    errEl.classList.remove('hidden');
    return;
  }
  okEl.textContent = 'Account verified! Redirecting to sign in…';
  okEl.classList.remove('hidden');
  setTimeout(() => location.href = '/', 1400);
});
</script>
</body>
</html>
