<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Debug</title>
<style>
  body { font-family: monospace; background:#111; color:#0f0; padding:20px; font-size:13px; }
  h2 { color:#0ff; }
  button { padding:8px 14px; margin:4px 4px 4px 0; cursor:pointer; font-family:monospace; }
  pre { background:#000; padding:10px; overflow:auto; max-height:300px; border:1px solid #333; }
  .ok { color:#0f0; } .err { color:#f55; }
</style>
</head>
<body>
<h2>Session Debug</h2>

<div>
  <button onclick="showCookies()">Show Cookies</button>
  <button onclick="checkMe()">GET /api/auth/me</button>
  <button onclick="checkList()">GET /api/admin/clients</button>
  <button onclick="checkClient2()">GET /api/admin/clients/2</button>
  <button onclick="forceLogout()">Force Logout (clear cookie)</button>
</div>

<h2>Sign in as admin</h2>
<input id="em" placeholder="email" style="width:320px;padding:6px;"/>
<input id="pw" type="password" placeholder="password" style="width:200px;padding:6px;"/>
<button onclick="doLogin()">Log In</button>

<h2>Output</h2>
<pre id="out">Ready.</pre>

<script>
const out = document.getElementById('out');
function log(msg, cls='') {
  out.innerHTML += `\n<span class="${cls}">${msg}</span>`;
  out.scrollTop = out.scrollHeight;
}
function clear() { out.innerHTML = ''; }

function showCookies() {
  clear();
  log('document.cookie: ' + (document.cookie || '(empty — expected, cookie is HttpOnly)'));
  log('— HttpOnly cookies are NOT visible to JS. That is normal. —');
  log('To inspect the session cookie, go to DevTools → Application → Cookies.');
}

async function checkMe() {
  clear();
  log('> GET /api/auth/me');
  const r = await fetch('/api/auth/me', { credentials: 'same-origin' });
  const t = await r.text();
  log('status: ' + r.status, r.ok ? 'ok' : 'err');
  log('body: ' + t);
  try {
    const j = JSON.parse(t);
    if (j.user) {
      log('--- parsed ---');
      log('email: ' + j.user.email);
      log('role : ' + j.user.role, j.user.role === 'admin' ? 'ok' : 'err');
    }
  } catch(e) { log('(not JSON)'); }
}

async function checkList() {
  clear();
  log('> GET /api/admin/clients');
  const r = await fetch('/api/admin/clients', { credentials: 'same-origin' });
  const t = await r.text();
  log('status: ' + r.status, r.ok ? 'ok' : 'err');
  log('body: ' + t);
}

async function checkClient2() {
  clear();
  log('> GET /api/admin/clients/2');
  const r = await fetch('/api/admin/clients/2', { credentials: 'same-origin' });
  const t = await r.text();
  log('status: ' + r.status, r.ok ? 'ok' : 'err');
  log('body: ' + t);
}

async function forceLogout() {
  clear();
  await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
  document.cookie = 'session=; Path=/; Max-Age=0';
  log('Logged out. Cookie cleared.', 'ok');
}

async function doLogin() {
  clear();
  const email = document.getElementById('em').value.trim();
  const password = document.getElementById('pw').value;
  log('> POST /api/auth/login  ' + email);
  const r = await fetch('/api/auth/login', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const t = await r.text();
  log('status: ' + r.status, r.ok ? 'ok' : 'err');
  log('body: ' + t);
  if (r.ok) {
    log('Login OK. Now click "GET /api/auth/me" to verify role.', 'ok');
  }
}
</script>
</body>
</html>
