<style>
/* ============================================================
   funding.html — PHFA Screenshot Theme (Bootstrap-like)
   ============================================================ */

body {
  background: #ffffff;
  color: #333333;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  margin: 0;
  padding-top: 64px;
}

/* ---------- Navbar ---------- */
.navbar-pahf {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1030;
  background: #0a2540;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 64px;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}
.navbar-pahf__brand {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}
.pahf-logo-text {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #d94f04;
  line-height: 1;
  text-decoration: none;
}
.navbar-pahf__title {
  color: #ffffff;
  font-size: 16px;
  font-weight: 600;
  text-decoration: underline;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.navbar-pahf__title:hover {
  color: #dbe7f0;
  text-decoration: underline;
}
.navbar-pahf__nav {
  display: flex;
  align-items: center;
  gap: 4px;
}
.navbar-pahf__nav a {
  color: #cfdde8;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .5px;
  padding: 8px 14px;
  border-radius: 4px;
  text-decoration: none;
}
.navbar-pahf__nav a:hover,
.navbar-pahf__nav a.is-active {
  background: #0b4f7a;
  color: #ffffff;
  text-decoration: none;
}

/* ---------- Page Layout ---------- */
.page-wrap {
  max-width: 1300px;
  margin: 0 auto;
  padding: 30px 24px 60px;
}

.page-title {
  color: #0b4f7a;
  font-size: 34px;
  font-weight: 400;
  margin: 0 0 24px 0;
  letter-spacing: -0.3px;
}

/* ---------- Toolbar ---------- */
.table-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
  margin-bottom: 12px;
  font-size: 14px;
  color: #333;
}
.toolbar__group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.toolbar__group--center {
  margin: 0 auto;
}
.toolbar select,
.toolbar input[type="search"] {
  font-family: inherit;
  font-size: 14px;
  color: #333;
  background: #ffffff;
  border: 1px solid #ccc;
  border-radius: 4px;
  height: 34px;
  padding: 0 10px;
  outline: none;
}
.toolbar input[type="search"] {
  min-width: 200px;
}
.toolbar select:focus,
.toolbar input[type="search"]:focus {
  border-color: #0b4f7a;
  box-shadow: 0 0 0 2px rgba(11,79,122,.15);
}

.tool-btn {
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  background: #ffffff;
  color: #333;
  border: 1px solid #ccc;
  border-left-width: 0;
  height: 34px;
  padding: 0 16px;
  cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.tool-btn:first-child {
  border-left-width: 1px;
  border-radius: 4px 0 0 4px;
}
.tool-btn:last-child {
  border-radius: 0 4px 4px 0;
}
.tool-btn:hover {
  background: #f4f6f8;
  color: #0b4f7a;
}
.tool-btn:active {
  background: #e8eff5;
}

/* ---------- Table ---------- */
.table-scroll {
  overflow-x: auto;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
  background: #fff;
}
table.data-table {
  width: 100%;
  min-width: 1100px;
  border-collapse: collapse;
  font-size: 14px;
}
table.data-table thead th {
  background: #f4f6f8;
  color: #333;
  font-weight: 700;
  text-align: left;
  padding: 12px 15px;
  border-bottom: 1px solid #ddd;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
table.data-table thead th:hover {
  background: #eef2f6;
}
table.data-table thead th.no-sort {
  cursor: default;
}
table.data-table thead th.no-sort:hover {
  background: #f4f6f8;
}
table.data-table thead th .sort-icon {
  display: inline-block;
  margin-left: 6px;
  color: #a0aab5;
  font-size: 11px;
}
table.data-table thead th.is-sorted .sort-icon {
  color: #0b4f7a;
}

table.data-table tbody td {
  padding: 12px 15px;
  border-bottom: 1px solid #e9ecef;
  vertical-align: middle;
  color: #333;
}
table.data-table tbody tr:nth-child(even) {
  background: #f9fafb;
}
table.data-table tbody tr:hover {
  background: #f1f6fa;
}
table.data-table tbody tr {
  cursor: pointer;
}

td.c-no { width: 60px; color: #6b7a89; font-size: 13px; }
td.c-name { font-weight: 600; color: #0b4f7a; }
td.c-amount { text-align: right; font-weight: 600; white-space: nowrap; }
th.c-amount { text-align: right; }

.status-text {
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .5px;
  text-transform: uppercase;
}
.status-text--pending { color: #8a6d00; }
.status-text--awarded { color: #558b2f; }
.status-text--review  { color: #0b4f7a; }
.status-text--closed  { color: #b60606; }

.empty-state {
  padding: 40px 20px;
  text-align: center;
  color: #6b7a89;
  font-style: italic;
}

/* ---------- Footer / Pagination ---------- */
.table-footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
  font-size: 13px;
  color: #6b7a89;
}
.pager {
  display: flex;
  align-items: center;
  gap: 4px;
}
.pager button {
  font-family: inherit;
  font-size: 13px;
  min-width: 32px;
  height: 32px;
  padding: 0 10px;
  background: #ffffff;
  color: #0b4f7a;
  border: 1px solid #ccc;
  border-radius: 4px;
  cursor: pointer;
}
.pager button:hover:not(:disabled) {
  background: #f4f6f8;
  border-color: #0b4f7a;
}
.pager button.is-current {
  background: #0b4f7a;
  border-color: #0b4f7a;
  color: #ffffff;
  font-weight: 700;
}
.pager button:disabled {
  opacity: .5;
  cursor: default;
}
.pager .gap {
  padding: 0 4px;
  color: #a0aab5;
}

/* ---------- Dossier Drawer ---------- */
.backdrop {
  position: fixed;
  inset: 0;
  z-index: 1040;
  background: rgba(10, 37, 64, .5);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.backdrop.hidden { display: none !important; }
.dossier {
  width: 100%;
  max-width: 600px;
  max-height: 86vh;
  overflow: auto;
  background: #ffffff;
  border-radius: 6px;
  box-shadow: 0 20px 50px rgba(10,37,64,.35);
}
.dossier__head {
  position: sticky;
  top: 0;
  z-index: 2;
  background: #0a2540;
  color: #ffffff;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.dossier__head h3 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
}
.dossier__close {
  background: transparent;
  border: 0;
  color: #ffffff;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  padding: 0 4px;
}
.dossier__close:hover { color: #d94f04; }
.dossier__body {
  padding: 20px 24px 28px;
}
.dossier__label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #0b4f7a;
  margin: 22px 0 6px;
  border-bottom: 1px solid #e0e0e0;
  padding-bottom: 4px;
}
.dossier__label:first-child { margin-top: 0; }
.entry {
  display: flex;
  gap: 16px;
  padding: 10px 0;
  border-bottom: 1px solid #f4f6f8;
  font-size: 14px;
}
.entry:last-child { border-bottom: 0; }
.entry__k {
  flex: 0 0 150px;
  color: #6b7a89;
  font-weight: 500;
  font-size: 13px;
}
.entry__v {
  flex: 1;
  color: #333;
  font-weight: 600;
}
.entry__v--amount {
  font-size: 16px;
  color: #0b4f7a;
}
.entry__v--script {
  font-weight: 400;
  color: #6b7a89;
}
.redaction {
  color: #a0aab5;
  font-style: italic;
  letter-spacing: 1px;
}

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 1050;
  background: #0a2540;
  color: #ffffff;
  font-size: 14px;
  font-weight: 500;
  padding: 12px 20px;
  border-radius: 4px;
  box-shadow: 0 10px 30px rgba(10,37,64,.3);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity .2s ease, transform .2s ease;
  pointer-events: none;
}
.toast.is-visible {
  opacity: 1;
  transform: translateY(0);
}

/* ---------- Responsive ---------- */
@media (max-width: 991px) {
  .page-title { font-size: 28px; }
  .toolbar__group--center { order: 3; margin: 0; width: 100%; }
  .tool-btn { flex: 1; }
}
@media (max-width: 767px) {
  .navbar-pahf__title { display: none; }
  .page-wrap { padding: 20px 14px 40px; }
  .page-title { font-size: 24px; }
  .toolbar input[type="search"] { min-width: 0; width: 100%; }
  .toolbar__group { width: 100%; }
  .entry { flex-direction: column; gap: 2px; }
  .entry__k { flex: none; }
}

/* ---------- Print ---------- */
@media print {
  .navbar-pahf, .table-toolbar, .pager, .backdrop, .toast { display: none !important; }
  body { padding-top: 0; background: #fff; }
  .page-wrap { max-width: none; padding: 0; }
  .table-scroll { overflow: visible; border: 0; }
  table.data-table { min-width: 0; font-size: 10px; }
  table.data-table thead th { position: static; }
  table.data-table tbody tr { page-break-inside: avoid; }
}
</style>
</head>

    { n:'NAANA P. AMANKONAH HINNEH',   a:'1537 STONEY LANE' },
    { n:'CLINT TYLER PETERS',          a:'98 WEST 26TH STREET' },
    { n:'KEITH WARMKESSEL, JR',        a:'3483 MOUNTAIN ROAD' },
    { n:'DENNIS FILLEBROWN',           a:'1295 STARK ROAD' },
    { n:'MASON HETRICK',               a:'617 VINE STREET, UNIT 2' },
    { n:'KARISSA J. KREITZ',           a:'528 MAIN STREET, UNIT FRNT' },
    { n:'ELIAS MICHAEL BATIHK',        a:'141 STONEGATE VILLAGE' }
  ];

  /* ================================================================
     3. BUILD ROWS
     ================================================================ */
  const ROWS = APPLICANTS.map((a, i) => ({
    id      : i + 1,
    program : AWARD.program,
    org     : AWARD.org,
    amount  : AWARD.amount,
    year    : AWARD.year,
    status  : AWARD.status,
    name    : a.n,
    street  : a.a
  }));

  /* ================================================================
     4. COLUMNS
     ================================================================ */
  const COLUMNS = [
    { key:'program', label:'Project/Program Name', type:'text'  },
    { key:'org',     label:'Organization Name',    type:'text'  },
    { key:'amount',  label:'Total Awarded',        type:'money' },
    { key:'year',    label:'Grant Year',           type:'text'  },
    { key:'status',  label:'Application Status',   type:'text'  },
    { key:'name',    label:'Name',                 type:'text', cls:'c-name'  },
    { key:'street',  label:'Street Address',       type:'text'  }
  ];

  /* ================================================================
     5. STATE
     ================================================================ */
  const state = {
    query    : '',
    sortKey  : 'id',
    sortDir  : 'asc',
    page     : 1,
    pageSize : 25
  };

  /* ================================================================
     6. DOM REFS
     ================================================================ */
  const $ = (id) => document.getElementById(id);
  const headRow    = $('tableHeadRow');
  const tbody      = $('tableBody');
  const emptyEl    = $('emptyState');
  const infoEl     = $('tableInfo');
  const pagerEl    = $('pager');
  const searchEl   = $('searchInput');
  const sizeEl     = $('pageSize');
  const backdrop   = $('backdrop');
  const dossierEl  = $('dossierBody');
  const toastEl    = $('toast');

  /* ================================================================
     7. HELPERS
     ================================================================ */
  function statusText(status) {
    const key = String(status || '').toUpperCase();
    const cls = 'status-text status-text--' + key.toLowerCase();
    return `<span class="${cls}">${esc(key)}</span>`;
  }

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('is-visible'), 2300);
  }

  /* ================================================================
     8. VIEW — filter + sort
     ================================================================ */
  function currentView() {
    const q = state.query.trim().toLowerCase();

    let rows = ROWS.filter((r) => {
      if (!q) return true;
      return [r.program, r.org, r.year, r.status, r.name, r.street]
        .join(' ').toLowerCase().includes(q);
    });

    const dir = state.sortDir === 'asc' ? 1 : -1;
    const key = state.sortKey;

    rows.sort((a, b) => {
      if (key === 'amount') return (Number(a.amount) - Number(b.amount)) * dir;
      if (key === 'id')     return (a.id - b.id) * dir;
      const va = String(a[key] ?? '').toLowerCase();
      const vb = String(b[key] ?? '').toLowerCase();
      return va.localeCompare(vb) * dir;
    });

    return rows;
  }

  /* ================================================================
     9. RENDER — HEAD
     ================================================================ */
  function renderHead() {
    headRow.innerHTML = COLUMNS.map((c) => {
      const active = state.sortKey === c.key;
      const icon   = active ? (state.sortDir === 'asc' ? '▲' : '▼') : '⇅';
      return `<th data-key="${c.key}" class="${c.cls || ''} ${active ? 'is-sorted' : ''}">
                ${esc(c.label)}<span class="sort-icon">${icon}</span>
              </th>`;
    }).join('');

    headRow.querySelectorAll('th').forEach((th) => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        if (state.sortKey === key) {
          state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          state.sortKey = key;
          state.sortDir = 'asc';
        }
        state.page = 1;
        render();
      });
    });
  }

  /* ================================================================
     10. RENDER — BODY + PAGER
     ================================================================ */
  function render() {
    const rows  = currentView();
    const total = rows.length;

    const size  = state.pageSize === 'all' ? (total || 1) : Number(state.pageSize);
    const pages = Math.max(1, Math.ceil(total / size));
    if (state.page > pages) state.page = pages;

    const start = (state.page - 1) * size;
    const slice = state.pageSize === 'all' ? rows : rows.slice(start, start + size);

    emptyEl.classList.toggle('hidden', total !== 0);

    tbody.innerHTML = slice.map((r) => `
      <tr data-id="${r.id}">
        <td>${esc(r.program)}</td>
        <td>${esc(r.org)}</td>
        <td class="c-amount">${fmtMoney(r.amount)}</td>
        <td>${esc(r.year)}</td>
        <td>${statusText(r.status)}</td>
        <td class="c-name">${esc(r.name)}</td>
        <td>${esc(r.street)}</td>
      </tr>
    `).join('');

    tbody.querySelectorAll('tr').forEach((tr) => {
      tr.addEventListener('click', () => openDossier(Number(tr.dataset.id)));
    });

    if (total === 0) {
      infoEl.textContent = 'Showing 0 to 0 of 0 entries';
    } else if (state.pageSize === 'all') {
      infoEl.textContent = `Showing 1 to ${total} of ${total} entries`;
    } else {
      const to = Math.min(start + size, total);
      infoEl.textContent = `Showing ${start + 1} to ${to} of ${total} entries` +
        (state.query ? ` (filtered from ${ROWS.length})` : '');
    }

    renderPager(pages);
  }

  function renderPager(pages) {
    if (state.pageSize === 'all' || pages <= 1) { pagerEl.innerHTML = ''; return; }

    const win = 2;
    let html = `<button type="button" data-page="${state.page - 1}" ${state.page === 1 ? 'disabled' : ''}>Prev</button>`;

    for (let p = 1; p <= pages; p++) {
      if (p === 1 || p === pages || Math.abs(p - state.page) <= win) {
        html += `<button type="button" data-page="${p}" class="${p === state.page ? 'is-current' : ''}">${p}</button>`;
      } else if (Math.abs(p - state.page) === win + 1) {
        html += `<span class="gap">…</span>`;
      }
    }

    html += `<button type="button" data-page="${state.page + 1}" ${state.page === pages ? 'disabled' : ''}>Next</button>`;
    pagerEl.innerHTML = html;

    pagerEl.querySelectorAll('button[data-page]').forEach((b) => {
      b.addEventListener('click', () => {
        const p = Number(b.dataset.page);
        if (p < 1 || p > pages || p === state.page) return;
        state.page = p;
        render();
        $('tableScroll').scrollTop = 0;
      });
    });
  }

  /* ================================================================
     11. DOSSIER
     ================================================================ */
  function entry(k, v, extraClass) {
    return `<div class="entry">
              <div class="entry__k">${esc(k)}</div>
              <div class="entry__v ${extraClass || ''}">${v}</div>
            </div>`;
  }

  function openDossier(id) {
    const r = ROWS.find((x) => x.id === id);
    if (!r) return;

    dossierEl.innerHTML = `
      <div class="dossier__label">Award Record</div>
      ${entry('Project/Program', esc(r.program))}
      ${entry('Organization', esc(r.org))}
      ${entry('Total Awarded', fmtMoney(r.amount), 'entry__v--amount')}
      ${entry('Grant Year', esc(r.year))}
      ${entry('Application Status', statusText(r.status))}

      <div class="dossier__label">Applicant</div>
      ${entry('Name', esc(r.name))}
      ${entry('Street Address', esc(r.street), 'entry__v--script')}

      <div class="dossier__label">Withheld from Public Record</div>
      ${entry('City / State / ZIP', '<span class="redaction">—— redacted ——</span>')}
      ${entry('Telephone',         '<span class="redaction">—— redacted ——</span>')}
      ${entry('E-mail',            '<span class="redaction">—— redacted ——</span>')}
      ${entry('Date of Birth',     '<span class="redaction">—— redacted ——</span>')}
      ${entry('Social Security No.','<span class="redaction">—— redacted ——</span>')}

      <div class="dossier__label">Register Reference</div>
      ${entry('Record No.', esc(String(r.id).padStart(4, '0')))}
    `;

    backdrop.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  function closeDossier() {
    backdrop.classList.add('hidden');
    document.body.style.overflow = '';
  }

  $('dossierClose').addEventListener('click', closeDossier);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeDossier(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !backdrop.classList.contains('hidden')) closeDossier();
  });

  /* ================================================================
     12. EXPORT
     ================================================================ */
  function toCSV() {
    const cols = [
      'Project/Program Name','Organization Name','Total Awarded','Grant Year',
      'Application Status','Name','Street Address'
    ];
    const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;

    const lines = [cols.map(cell).join(',')];
    currentView().forEach((r) => {
      lines.push([
        r.program, r.org, r.amount, r.year, r.status, r.name, r.street
      ].map(cell).join(','));
    });
    return lines.join('\r\n');
  }

  function downloadCSV() {
    const blob = new Blob(['\uFEFF' + toCSV()], { type:'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `phfa-funding-register-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Register downloaded (CSV)');
  }

  async function copyRegister() {
    const text = toCSV().replace(/\r\n/g, '\n');
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      toast(`${currentView().length} rows copied`);
    } catch (_) {
      toast('Copy blocked — use Excel');
    }
  }

  document.querySelectorAll('.tool-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      switch (btn.dataset.act) {
        case 'copy' : copyRegister(); break;
        case 'excel': downloadCSV(); break;
        case 'pdf'  : toast('Choose “Save as PDF” in the print dialog');
                      setTimeout(() => window.print(), 350); break;
        case 'print': window.print(); break;
      }
    });
  });

  /* ================================================================
     13. FILTERS
     ================================================================ */
  let searchTimer = null;
  searchEl.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.query = searchEl.value;
      state.page  = 1;
      render();
    }, 140);
  });

  sizeEl.addEventListener('change', () => {
    state.pageSize = sizeEl.value === 'all' ? 'all' : Number(sizeEl.value);
    state.page = 1;
    render();
  });

  /* ================================================================
     14. BOOT
     ================================================================ */
  renderHead();
  render();

})();
</script>
</body>
</html>
