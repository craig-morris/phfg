<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply | PHFA Grants</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230a2540'/><text x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='bold' fill='%23d94f04' text-anchor='middle'>P</text></svg>">
<link rel="stylesheet" href="css/pahf.css">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f5f7fa;color:#333;margin:0;padding-top:64px;font-size:15px;line-height:1.55;}
.navbar-pahf{position:fixed;top:0;left:0;right:0;z-index:1030;background:#0a2540;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:64px;}
.pahf-logo-text{font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:1px;color:#d94f04;text-decoration:none;}
.navbar-pahf__title{color:#fff;font-size:16px;font-weight:600;text-decoration:underline;}
.navbar-pahf__nav{display:flex;gap:2px;}
.navbar-pahf__nav a{color:#cfdde8;font-size:13px;font-weight:600;letter-spacing:.5px;padding:8px 14px;border-radius:4px;text-decoration:none;}
.navbar-pahf__nav a:hover,.navbar-pahf__nav a.is-active{background:#0b4f7a;color:#fff;}
.page-wrap{max-width:900px;margin:0 auto;padding:36px 24px 80px;}
.page-title{color:#0b4f7a;font-size:34px;font-weight:400;margin:0 0 8px;}
.page-sub{color:#6b7a89;margin:0 0 28px;max-width:64ch;}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;box-shadow:0 1px 3px rgba(10,37,64,.06);padding:26px 30px;margin-bottom:22px;}
.card h2{margin:0 0 14px;font-size:18px;color:#0a2540;font-weight:700;}
.summary-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;}
.summary-list li{display:flex;flex-direction:column;gap:2px;font-size:14px;}
.summary-list strong{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#6b7a89;font-weight:700;}
.summary-list span{color:#0a2540;font-weight:600;word-break:break-word;}
.amount-banner{background:linear-gradient(135deg,#0f3a24 0%,#14532d 100%);color:#fff;border-radius:8px;padding:22px 26px;margin-bottom:22px;}
.amount-banner small{display:block;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#7cf0a5;margin-bottom:6px;}
.amount-banner p{margin:0;font-size:36px;font-weight:700;letter-spacing:-1px;}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:13px 24px;border-radius:5px;border:1px solid transparent;cursor:pointer;text-decoration:none;font-family:inherit;}
.btn-navy{background:#0b4f7a;color:#fff;}
.btn-navy:hover{background:#083d5e;color:#fff;}
.empty-cta{text-align:center;padding:36px 20px;}
.empty-cta p{color:#6b7a89;margin:0 0 18px;}
@media(max-width:700px){.summary-list{grid-template-columns:1fr;}.navbar-pahf__title{display:none;}}
</style>
</head>
<body>

<nav class="navbar-pahf">
  <div style="display:flex;align-items:center;gap:14px;">
    <a class="pahf-logo-text" href="index.html">PHFA</a>
    <a class="navbar-pahf__title" href="index.html">PA Housing Affordability and Rehabilitation Enhancement Fund</a>
  </div>
  <div class="navbar-pahf__nav">
    <a href="index.html">Home</a>
    <a href="funding.html">Programs</a>
    <a href="apply.html" class="is-active">Apply</a>
    <a href="admin.html">Admin</a>
  </div>
</nav>

<div class="page-wrap">
  <h1 class="page-title">Your Application</h1>
  <p class="page-sub">Here is the submission you have on file with us. Our grant administrators review every application individually and will contact you at the email and phone number you provided.</p>

  <div id="appContent"></div>
</div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const CUR = { US:{locale:'en-US',code:'USD'}, UK:{locale:'en-GB',code:'GBP'}, EU:{locale:'de-DE',code:'EUR'} };
  function fmt(a, region){ try { return new Intl.NumberFormat(CUR[region]?.locale || 'en-US',{style:'currency',currency:CUR[region]?.code || 'USD',maximumFractionDigits:0}).format(a); } catch(_) { return '$'+Number(a||0).toLocaleString('en-US'); } }

  let intake = [];
  try { intake = JSON.parse(localStorage.getItem('phfa.intake') || '[]'); } catch(_) {}

  const content = $('appContent');

  if (!intake.length) {
    content.innerHTML = `
      <div class="card empty-cta">
        <h2>No application on file yet</h2>
        <p>Return to the home page and complete the “Check If I Qualify” flow to submit your application.</p>
        <a class="btn btn-navy" href="index.html">Start my eligibility check</a>
      </div>`;
    return;
  }

  const r = intake[intake.length - 1];

  content.innerHTML = `
    <div class="amount-banner">
      <small>Your pre-approved amount</small>
      <p>${esc(fmt(r.amount, r.region))}</p>
    </div>

    <div class="card">
      <h2>Sign-up information on file</h2>
      <ul class="summary-list">
        <li><strong>Full name</strong><span>${esc(r.name)}</span></li>
        <li><strong>Email</strong><span>${esc(r.email || '—')}</span></li>
        <li><strong>Phone</strong><span>${esc(r.phone || '—')}</span></li>
        <li><strong>Street address</strong><span>${esc(r.address || '—')}</span></li>
        <li><strong>Date of birth</strong><span>${esc(r.dob || '—')}</span></li>
        <li><strong>Region</strong><span>${esc(r.region)}</span></li>
        <li><strong>Homeowner</strong><span>${r.ownsHome ? ('Yes · ' + esc(r.year || '—')) : 'No'}</span></li>
        <li><strong>Employment</strong><span>${r.employed ? ('Yes · ' + esc(r.employer || '—')) : 'No'}</span></li>
        <li><strong>Unpaid loans</strong><span>${esc(r.loans)}</span></li>
        <li><strong>Status</strong><span>Submitted · under review</span></li>
      </ul>
    </div>

    <div class="card">
      <h2>What happens next</h2>
      <p style="margin:0;color:#6b7a89;font-size:14.5px;line-height:1.7;">
        Your application has been routed to our grant administrators. A specialist will
        contact you at the email and phone number above to complete verification.
        In the meantime, you can continue the conversation in the chat widget at any time.
      </p>
    </div>
  `;
})();
</script>

</body>
</html>
